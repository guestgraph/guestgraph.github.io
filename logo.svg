<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GuestGraph">
  <!-- Three scattered records resolve into one derived profile. The sources stay open
       (nothing is consumed); the profile is solid (it is a conclusion, not a record). -->
