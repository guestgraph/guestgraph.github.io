name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Two ways to hang this job in the server step are already documented in CLAUDE.md and
    # both were hit for real. A third would otherwise burn the 360-minute default before
    # anyone learned it existed, on a check destined to be required.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The sitemap's dates are read from each page's last commit, and a shallow clone has
          # only one commit to name for every page.
          fetch-depth: 0
      # First, because it needs nothing installed and it catches the one failure the browser
      # cannot see: a note edited without regenerating its clip renders perfectly and speaks
      # the old words. --dry-run bills nothing and needs no key. blust.ch has had this step
      # since its clips existed; here ten stale clips sat on a green pull request before it did.
      - name: Clips still say what the notes say
        working-directory: talks/intro/tts
        run: |
          out=$(./generate.py --dry-run)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -q 'would write'; then
            echo "::error::narration is stale — run talks/intro/tts/generate.py and commit the clips"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Nothing on a page says when its German was made, so an English sentence reworded in a
      # pull request keeps a German that now says something else, and every check that reads
      # the rendered page reads one language and passes. This compares the pull request's pages
      # with its base by German value and fails where the German stayed and the English moved.
      # A pull request's checkout is GitHub's merge of it into the base, so the base it was built
      # on is that merge's first parent; a freshly fetched base could be newer and bring its own
      # commits into the range.
      - name: No German left behind an English edit
        if: github.event_name == 'pull_request'
        run: npx design german stale HEAD^1 HEAD
      # All three run after npm ci because they import @robertblust/design, which is not on disk
      # until then — they used to run before it, back when the card check imported nothing
      # outside node's standard library. They still run before the browser: none of them renders
      # a page, and a stale card is the one failure the browser suite cannot see, because the
      # card is a valid PNG of a page that has since moved on.
      - name: The card check still works
        run: npm run test:og
      - name: Cards still show the page they render
        run: npm run og:check
      # A file that is not what the package ships should fail on a cheap step, not on a
      # rendered page.
      - name: The shared files are still what the package ships
        run: npm run design:check
      # A lastmod is used only while it is accurate, so the dates are written from git and held
      # to it here: a page committed without `npm run sitemap` fails on the date it now bears.
      # After npm ci because the command arrives from the package.
      - name: The sitemap's dates are still each page's last change
        run: npm run sitemap:check
      # Same reason, one repository further out: the API page is written from two services'
      # OpenAPI documents at the commits api-sources.json pins, so a page that has drifted
      # from them is a page that describes calls nobody can make.
      # After npm ci: build/model.mjs imports the parser from companygraph-meta-model, which is
      # not on disk until then. The token is only for the rate limit.
      - name: The model still matches the pinned commit
        run: npm run model:check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Every region this site derives from the model, held against model.json. After npm ci
      # because the renderers come from @robertblust/design; it reaches no network.
      - name: The derived regions still match the model
        run: npm run pages:check
      - name: The API page says what the pinned documents say
        run: npm run api:check
      # The other half, and deliberately not a failure: api:check proves the page is what the
      # pins say, this says whether the pins are still what the services say. A pin behind its
      # service is a page publishing an older API on purpose, or an owner who has not looked
      # lately, and only a person can tell those apart. The token is only for the rate limit.
      - name: How far the API pins have fallen behind
        run: npm run pin:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: python3 -m http.server 8000 > /dev/null 2>&1 &
      - name: Wait for the server
        run: |
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/ > /dev/null && exit 0
            sleep 0.5
          done
          echo "Server never came up on :8000" >&2
          exit 1
      - name: Assert what it renders
        run: npm run verify
      - name: Every own link resolves
        run: npx design links
