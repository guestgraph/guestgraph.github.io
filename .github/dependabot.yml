# Every npm dependency here is a devDependency — playwright and pdf-lib drive `npm run
# verify`, `npm run og` and `npm run pdf`. None of it reaches a visitor: the pages are
# self-contained and ship no external assets. So this file is not a vulnerability
# response, it is the thing that stops the toolchain bit-rotting until CI breaks on a
# Playwright too old for the Chromium it installs.
#
# The shape is copied from guestgraph/engine, deliberately — the same duplication the
# design tokens and the deck footer have, and the same absence of a tripwire. Grouping
# minor and patch means a quiet week is one pull request, not five; a major arrives on
# its own, which is when it deserves reading.
version: 2
updates:
  # Two package.json files, and only the root one is exercised by CI: ci.yml runs a single
  # `npm ci` at the root before `npm run verify`. A bump under talks/intro therefore gets a
  # green run that proves nothing about the directory it changed — the deck's PDF export is
  # what uses those packages, and `npm run pdf` is not a CI step because it writes files this
  # repository commits. Read those pull requests; do not merge them on the checkmark.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/talks/intro"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
