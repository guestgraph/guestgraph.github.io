# Every npm dependency here is a devDependency — playwright and pdf-lib drive `npm run
# verify`, `npm run og` and `npm run pdf`. None of it reaches a visitor: the pages are
# self-contained and ship no external assets. So this file is not a vulnerability
# response, it is the thing that stops the toolchain bit-rotting until CI breaks on a
# Playwright too old for the Chromium it installs.
#
# The shape is copied from guestgraph/engine, deliberately — the same duplication the
# design tokens and the deck footer have, and the same absence of a tripwire. Grouping
# minor and patch means a quiet week is one pull request, not five; a major arrives on
# its own, which is when it deserves reading.
version: 2
updates:
  # One package.json, at the root. There used to be a second under talks/intro carrying the
  # deck's `pdf` script and pdf-lib, which meant a bump there landed green having proved
  # nothing — CI only ever ran `npm ci` at the root. The script and the dependency moved to
  # the root on 2026-08-26, so there is one manifest and CI exercises it.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Declared first on purpose: Dependabot puts a dependency in the FIRST group it matches,
      # so naming the design package here keeps it out of minor-and-patch below. A design
      # release is a minor by the package's own semver policy, so without this it would arrive
      # bundled with a Playwright or pdf-lib bump — and this is the one pull request that has
      # to be read rather than merged on sight: it goes red until someone runs `npm run design`
      # and commits what changed.
      design:
        patterns:
          - "@robertblust/design"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
